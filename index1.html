<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030712">
<title>Priyanshu Verma | Welcome</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #00c8ff;
    --light-blue: #8cecff;
    --dark: #030712;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(ellipse at center, #09234b 0%, #050d20 40%, #02040b 100%);
}

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.background-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: #0077ff;
    filter: blur(150px);
    opacity: 0.16;
    animation: glowMove 8s ease-in-out infinite alternate;
    pointer-events: none;
}

.glow-one {
    top: -100px;
    left: -80px;
}

.glow-two {
    bottom: -100px;
    right: -80px;
    background: #00d9ff;
    animation-delay: -4s;
}

@keyframes glowMove {
    from { transform: translate(0, 0) scale(0.8); }
    to { transform: translate(100px, 50px) scale(1.3); }
}

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    transition: opacity 1s ease, transform 1s ease;
}

.badge {
    border: 1px solid rgba(0, 200, 255, 0.45);
    border-radius: 30px;
    padding: 9px 17px;
    color: var(--light-blue);
    background: rgba(0, 160, 255, 0.08);
    backdrop-filter: blur(12px);
    font-size: 11px;
    letter-spacing: 3px;
    animation: fadeDown 1s ease both;
}

.portal {
    position: relative;
    width: 190px;
    height: 190px;
    margin: 34px 0 24px;
    display: grid;
    place-items: center;
    animation: portalFloat 4s ease-in-out infinite;
}

.ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #8cecff;
    border-right-color: #00c8ff;
    box-shadow:
        0 0 12px #00c8ff,
        inset 0 0 12px rgba(0, 200, 255, 0.2);
}

.ring-one {
    animation: rotate 4s linear infinite;
}

.ring-two {
    inset: 12px;
    border-width: 3px;
    border-top-color: #008cff;
    border-bottom-color: #8cecff;
    animation: rotateReverse 3s linear infinite;
}

.ring-three {
    inset: 25px;
    border-style: dashed;
    border-width: 1px;
    border-left-color: #00c8ff;
    border-right-color: #8cecff;
    animation: rotate 12s linear infinite;
}

.portal-core {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%, #7ceaff 0%, #007aff 25%, #061534 70%);
    box-shadow:
        0 0 20px #00aaff,
        0 0 55px rgba(0, 170, 255, 0.8),
        inset 0 0 25px #001a49;
    animation: corePulse 2s ease-in-out infinite alternate;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    to { transform: rotate(-360deg); }
}

@keyframes portalFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

@keyframes corePulse {
    from { transform: scale(0.94); filter: brightness(0.85); }
    to { transform: scale(1.05); filter: brightness(1.3); }
}

h1 {
    font-size: clamp(29px, 7vw, 57px);
    font-weight: 900;
    letter-spacing: clamp(2px, 1vw, 7px);
    margin-bottom: 14px;
    background: linear-gradient(90deg, #ffffff, #55dfff, #ffffff, #00aaff);
    background-size: 250% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: titleShine 5s linear infinite, fadeUp 1.2s ease both;
    text-shadow: 0 0 35px rgba(0, 180, 255, 0.15);
}

@keyframes titleShine {
    to { background-position: 250% center; }
}

.subtitle {
    color: #a9c9e9;
    font-size: 14px;
    line-height: 1.8;
    letter-spacing: 1px;
    max-width: 420px;
    animation: fadeUp 1.5s ease both;
}

.glass-card {
    margin-top: 30px;
    padding: 22px;
    width: min(360px, 100%);
    border: 1px solid rgba(100, 210, 255, 0.24);
    border-radius: 20px;
    background: linear-gradient(
        135deg,
        rgba(50, 140, 255, 0.13),
        rgba(255, 255, 255, 0.025)
    );
    backdrop-filter: blur(18px);
    box-shadow:
        0 15px 60px rgba(0, 0, 0, 0.25),
        inset 0 1px rgba(255, 255, 255, 0.08);
    animation: fadeUp 1.8s ease both;
}

.card-label {
    color: #80dfff;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 17px;
}

.features {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 9px;
}

.feature {
    font-size: 11px;
    color: #d9efff;
    padding: 9px 12px;
    border-radius: 9px;
    background: rgba(0, 130, 255, 0.1);
    border: 1px solid rgba(0, 180, 255, 0.17);
}

.enter-button {
    position: relative;
    overflow: hidden;
    margin-top: 30px;
    padding: 17px 34px;
    min-width: 220px;
    color: white;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 12px;
    font-weight: bold;
    border: 1px solid rgba(130, 230, 255, 0.8);
    border-radius: 12px;
    background: linear-gradient(110deg, #005bce, #00a9e8, #005bce);
    background-size: 200% 100%;
    box-shadow:
        0 0 20px rgba(0, 150, 255, 0.4),
        inset 0 1px rgba(255, 255, 255, 0.35);
    cursor: pointer;
    animation: buttonGlow 3s ease-in-out infinite;
    transition: transform 0.3s, box-shadow 0.3s;
}

.enter-button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: buttonShine 4s ease-in-out infinite;
}

.enter-button span {
    position: relative;
    z-index: 1;
}

.enter-button:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 0 35px rgba(0, 190, 255, 0.8);
}

@keyframes buttonGlow {
    0%, 100% { background-position: 0% center; }
    50% { background-position: 100% center; }
}

@keyframes buttonShine {
    0%, 50% { left: -120%; }
    80%, 100% { left: 160%; }
}

.footer {
    margin-top: 25px;
    color: #7894b5;
    font-size: 10px;
    letter-spacing: 2px;
    animation: fadeUp 2s ease both;
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

#flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #dffaff;
    opacity: 0;
    pointer-events: none;
}

body.entering .container {
    opacity: 0;
    transform: scale(1.15);
}

body.entering #flash {
    animation: flashOut 0.9s ease forwards;
}

@keyframes flashOut {
    0% { opacity: 0; }
    35% { opacity: 0.85; }
    100% { opacity: 0; }
}

@media (max-width: 480px) {
    .portal {
        width: 155px;
        height: 155px;
        margin-top: 25px;
    }

    .portal-core {
        width: 85px;
        height: 85px;
    }

    .glass-card {
        margin-top: 22px;
        padding: 17px;
    }

    .enter-button {
        margin-top: 24px;
    }

    .footer {
        font-size: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<main class="container">

    <div class="badge">✦ PERSONAL PORTFOLIO ✦</div>

    <div class="portal" aria-hidden="true">
        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>
        <div class="ring ring-three"></div>
        <div class="portal-core"></div>
    </div>

    <h1>PRIYANSHU<br>VERMA</h1>

    <p class="subtitle">
        Welcome to my digital world.<br>
        Learning • Growing • Creating
    </p>

    <section class="glass-card">
        <div class="card-label">DISCOVER MY WORLD</div>
        <div class="features">
            <div class="feature">✦ My Journey</div>
            <div class="feature">✧ My Skills</div>
            <div class="feature">◈ My Projects</div>
            <div class="feature">⚡ My Dreams</div>
        </div>
    </section>

    <button class="enter-button" id="enterButton" type="button">
        <span>ENTER MY WORLD &nbsp; →</span>
    </button>

    <div class="footer">DREAM BIG · WORK HARD · KEEP GROWING</div>

</main>

<div id="flash"></div>

<script>
/* Moving stars and particles */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];
let width = 0;
let height = 0;

function createStars() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(140, Math.floor(width * height / 6500));

    stars = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.35 + 0.08,
        alpha: Math.random() * 0.7 + 0.2
    }));
}

function drawStars() {
    ctx.clearRect(0, 0, width, height);

    for (const star of stars) {
        star.y -= star.speed;

        if (star.y < 0) {
            star.y = height;
            star.x = Math.random() * width;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(130,220,255,${star.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00bfff";
        ctx.fill();
    }

    ctx.shadowBlur = 0;
    requestAnimationFrame(drawStars);
}

window.addEventListener("resize", createStars);

createStars();
drawStars();

/* Enter the existing portfolio */
document.getElementById("enterButton").addEventListener("click", function () {
    document.body.classList.add("entering");

    setTimeout(function () {
        window.location.href = "./index.html";
    }, 700);
});
</script>

</body>
</html>
